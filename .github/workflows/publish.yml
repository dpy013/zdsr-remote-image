name: Build and publish image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the v prefix (for example 2.2.1.0)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve image version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$MANUAL_VERSION"
          fi
          case "$version" in
            ''|*[!0-9.]*|.*|*.) echo "Invalid version: $version" >&2; exit 1 ;;
          esac
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/zdsr-remote:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/zdsr-remote:latest